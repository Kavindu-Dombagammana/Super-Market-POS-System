        <aside class="sticky-box" aria-label="Current sale">
            <h2 class="receipt-title">ABC Supermarket</h2>
            <div id="item-display-section">
                <div id="item-list" aria-live="polite">
                    <p class="empty-cart">No items added yet.</p>
                </div>
            </div>
            <div id="price-section">
                <p><span>Total:</span><strong id="cart-total">Rs. 0.00</strong></p>
                <p><span>Discount:</span><strong id="cart-discount">Rs. 0.00</strong></p>
                <p><span>Sub Total:</span><strong id="cart-subtotal">Rs. 0.00</strong></p>
                <p><span>Cash:</span><strong id="cash-amount">Not entered</strong></p>
                <p><span>Change:</span><strong id="cash-change">Rs. 0.00</strong></p>
            </div>
            <div class="sale-actions">
