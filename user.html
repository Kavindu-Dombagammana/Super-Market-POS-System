    <div class="content-body">
        <!-- From Uiverse.io by german_7619 --> 
        <div class="radio-inputs">
            <label class="radio">
                <input type="radio" name="radio" checked="" />
                <span class="name">
                <span class="pre-name"></span>
                <span class="pos-name"></span>
                <span> All </span>
                </span>
                <div class="content">
                <div>

                        <div class="product-card">
                            <div id="product-description">

                                <p id="product-id"> Product ID</p>
                            </div>
                            
                            <div id="quantity-section">
                                <button id="svg-plus">+</button>
                                <label id="quantity">1</label>
                                <button id="svg-minus">-</button>
                            </div>
                        </div>
                    </div>
                </div>
                </div>

            <label class="radio">
                <input type="radio" name="radio" />
                <span class="name">
                <span class="pre-name"></span>
                <span class="pos-name"></span>
                <span> And </span>
                </span>
                <div class="content">
                <div>
                    <div>And content</div>
                </div>
                </div>

            <label class="radio">
                <input type="radio" name="radio" />
                <span class="name">
                <span class="pre-name"></span>
                <span class="pos-name"></span>
                <span> More </span>
                </span>
                <div class="content">
                <div>
                    <div>More content</div>
                </div>
                </div>
            </label>

            <label class="radio">
                <input type="radio" name="radio" />
                <span class="name">
                <span class="pre-name"></span>
                <span class="pos-name"></span>
                <span> Tabs </span>
                </span>

                <div>
                    <div>And Even More content</div>
                </div>
                </div>

                <input type="text" placeholder="Search Product Name or Product ID">
                <button>Search</button>
            </div>
